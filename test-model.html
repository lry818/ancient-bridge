<!DOCTYPE html>
<html>
<head>
  <title>GLB Model Test</title>
  <style>
    body { margin: 0; }
    canvas { width: 100%; height: 100vh; }
  </style>
</head>
<body>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf5f5f0);
    
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(5, 3, 5);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);
    
    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(1, 1, 1);
    scene.add(directionalLight);
    
    const gridHelper = new THREE.GridHelper(10, 10);
    scene.add(gridHelper);
    
    // 先添加一个测试立方体
    const testGeometry = new THREE.BoxGeometry(1, 0.5, 2);
    const testMaterial = new THREE.MeshPhongMaterial({ color: 0x4a90d9 });
    const testMesh = new THREE.Mesh(testGeometry, testMaterial);
    testMesh.position.y = 0.5;
    scene.add(testMesh);
    
    // 尝试加载GLB模型
    const loader = new GLTFLoader();
    loader.load(
      '/models/赵州桥.glb',
      function(gltf) {
        console.log('Model loaded successfully!');
        scene.remove(testMesh);
        
        const model = gltf.scene;
        model.scale.set(0.2, 0.2, 0.2);
        
        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        model.position.sub(center);
        
        scene.add(model);
      },
      function(xhr) {
        console.log('Loading model:', (xhr.loaded / xhr.total * 100) + '%');
      },
      function(error) {
        console.error('Error loading model:', error);
      }
    );
    
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
